[project]
name = "axel-labler"
version = "0.1.0"
description = "Web app to label, review and export truck axles in LiDAR point clouds"
readme = "README.md"
authors = [
    { name = "Max Trautwein", email = "46843360+MaxTrautwein@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pypcd4>=1.5.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
axel-labler = "axel_labler.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
